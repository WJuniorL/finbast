<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estallo — Prévia do novo inbox</title>
  <link rel="stylesheet" href="sidebar-original.css">
  <link rel="stylesheet" href="chat.css">
  <script defer src="chat.js"></script>
  <script defer src="sidebar-runtime.js"></script>
</head>
<body>
  <svg class="pv-sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="pv-inbox" viewBox="0 0 24 24"><path d="m4 4-2 10v6h20v-6L20 4H4Z M2 14h6l2 3h4l2-3h6"/></symbol>
    <symbol id="pv-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></symbol>
    <symbol id="pv-filter" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/><circle cx="8" cy="6" r="2" fill="var(--color-surface)"/><circle cx="15" cy="12" r="2" fill="var(--color-surface)"/></symbol>
    <symbol id="pv-down" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="pv-back" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol>
    <symbol id="pv-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="19" cy="12" r="1" fill="currentColor"/></symbol>
    <symbol id="pv-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="pv-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="pv-checks" viewBox="0 0 24 24"><path d="m2 12 4 4L16 6M11 16l10-10"/></symbol>
    <symbol id="pv-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M14 4v16M17 8h1M17 12h1"/></symbol>
    <symbol id="pv-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="pv-transfer" viewBox="0 0 24 24"><path d="M3 7h16m-4-4 4 4-4 4M21 17H5m4-4-4 4 4 4"/></symbol>
    <symbol id="pv-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></symbol>
    <symbol id="pv-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6M18 15a5 5 0 0 1 3 4v2"/></symbol>
    <symbol id="pv-pin" viewBox="0 0 24 24"><path d="M9 3h6l-1 6 4 4v2H6v-2l4-4-1-6ZM12 15v6"/></symbol>
    <symbol id="pv-unpin" viewBox="0 0 24 24"><path d="M3 3 21 21M9 3h6l-1 6 4 4v2h-3M9 9l-3 4v2h5M12 17v4"/></symbol>
    <symbol id="pv-unread" viewBox="0 0 24 24"><path d="M20 12v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h8M3 7l8 6 5-4"/><circle cx="19" cy="5" r="3" fill="currentColor" stroke="none"/></symbol>
    <symbol id="pv-clear" viewBox="0 0 24 24"><path d="m15 3 6 6-11 11H6l-4-4L15 3ZM8 10l6 6M10 20h11"/></symbol>
    <symbol id="pv-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></symbol>
    <symbol id="pv-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="pv-send" viewBox="0 0 24 24"><path d="m3 3 18 9-18 9 4-9-4-9ZM7 12h14"/></symbol>
    <symbol id="pv-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></symbol>
    <symbol id="pv-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 14a5 5 0 0 0 8 0M8 9h.01M16 9h.01"/></symbol>
    <symbol id="pv-sparkles" viewBox="0 0 24 24"><path d="m12 4 2.5 6.5L21 13l-6.5 2.5L12 22l-2.5-6.5L3 13l6.5-2.5L12 4ZM4 2v4M2 4h4M20 2v4M18 4h4"/></symbol>
    <symbol id="pv-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="2"/><path d="m21 15-6-6L3 21"/></symbol>
    <symbol id="pv-file" viewBox="0 0 24 24"><path d="M14 2H5v20h14V7l-5-5ZM14 2v5h5M8 12h8M8 16h6"/></symbol>
    <symbol id="pv-note" viewBox="0 0 24 24"><path d="M14 21H3V3h18v11l-7 7ZM14 21v-7h7M7 7h10M7 11h5"/></symbol>
    <symbol id="pv-reply" viewBox="0 0 24 24"><path d="m9 4-7 7 7 7v-5h5a7 7 0 0 1 7 7V11a5 5 0 0 0-5-5H9V4Z"/></symbol>
    <symbol id="pv-phone" viewBox="0 0 24 24"><path d="m8 3-5 2c0 8 8 16 16 16l2-5-5-3-2 2-5-5 2-2-3-5Z"/></symbol>
    <symbol id="pv-video" viewBox="0 0 24 24"><rect x="2" y="5" width="14" height="14" rx="2"/><path d="m16 9 6-3v12l-6-3"/></symbol>
    <symbol id="pv-robot" viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="14" rx="3"/><path d="M12 3v4M8 12v2M16 12v2M9 17h6M1 12v5M23 12v5"/></symbol>
    <symbol id="pv-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v.01"/></symbol>
    <symbol id="pv-keyboard" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M7 16h10"/></symbol>
    <symbol id="pv-whatsapp" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 1-12 7L3 20l1.5-5A8 8 0 1 1 20 11Z"/><path d="M8 7c0 5 4 8 8 8l1-3-3-1-1 1-2-2 1-1-1-3-3 1Z"/></symbol>
  </svg>
  <div class="pv-page-shell">
    <div id="original-system-navigation" class="pv-shell-navigation"></div>
    <div class="pv-shell-content">
      <div id="original-system-topbar" class="pv-shell-topbar"></div>
  <div class="pv-app" id="pv-app">
    <main class="pv-workspace" id="pv-workspace">
      <section class="pv-list-panel" id="pv-list-panel" aria-label="Conversas">
        <div class="pv-list-drawer-header"><strong>Conversas</strong><button class="pv-icon-button" data-command="hide-list" aria-label="Fechar lista de conversas"><svg class="pv-icon" aria-hidden="true"><use href="#pv-close"/></svg></button></div>
        <header class="pv-workspace-header" id="pv-workspace-header">
          <div class="pv-list-heading"><div class="pv-brand"><span class="pv-brand-mark"><svg class="pv-icon" aria-hidden="true"><use href="#pv-inbox"/></svg></span><h1>Inbox</h1></div><button class="pv-icon-button pv-help-button" data-command="shortcuts" aria-label="Atalhos do teclado" title="Atalhos do teclado"><svg class="pv-icon" aria-hidden="true"><use href="#pv-keyboard"/></svg></button></div>
          <nav class="pv-categories" role="tablist" aria-label="Categorias de conversas" id="pv-categories"></nav>
        </header>
        <div class="pv-list-tools">
          <div class="pv-search-row"><label class="pv-contact-search"><svg class="pv-icon" aria-hidden="true"><use href="#pv-search"/></svg><input id="pv-contact-search" type="search" placeholder="Buscar nome ou telefone" aria-label="Buscar nome ou telefone"><kbd>/</kbd></label><button class="pv-filter-button" id="pv-filter-trigger" aria-haspopup="dialog" aria-controls="pv-filter-popover" aria-expanded="false" aria-label="Filtrar conversas" title="Filtrar conversas"><svg class="pv-icon" aria-hidden="true"><use href="#pv-filter"/></svg><span class="pv-filter-count" id="pv-filter-count" hidden></span></button></div>
          <div class="pv-active-filters" id="pv-active-filters" aria-label="Filtros ativos" hidden></div>
          <div class="pv-list-caption"><span id="pv-result-count"></span><span class="pv-queue-help" title="A posição indica a ordem de chegada à fila de atendimento. Fixar muda apenas a ordem de exibição."><span>Ordem de chegada</span><svg class="pv-icon" aria-hidden="true"><use href="#pv-info"/></svg></span></div>
        </div>
        <div class="pv-contact-list" id="pv-contact-list"></div>
        <div class="pv-list-footer"><span class="pv-live-dot"></span>Atualização em tempo real<span class="pv-demo-label">Prévia</span></div>
      </section>
      <section class="pv-chat" id="pv-chat" aria-label="Conversa selecionada">
        <header class="pv-chat-header">
          <button class="pv-icon-button pv-show-list" id="pv-show-list" data-command="show-list" aria-label="Abrir lista de conversas" title="Conversas"><svg class="pv-icon" aria-hidden="true"><use href="#pv-back"/></svg></button>
          <div class="pv-chat-identity" id="pv-chat-identity"></div>
          <div class="pv-chat-actions"><button class="pv-icon-button" id="pv-message-search-trigger" data-command="search-messages" aria-expanded="false" aria-controls="pv-message-search-bar" aria-label="Buscar nesta conversa" title="Buscar nesta conversa"><svg class="pv-icon" aria-hidden="true"><use href="#pv-search"/></svg></button><button class="pv-button pv-primary" id="pv-claim" data-command="claim">Assumir</button><button class="pv-button pv-secondary pv-close-conversation" id="pv-close-conversation" data-command="close-conversation"><svg class="pv-icon" aria-hidden="true"><use href="#pv-check"/></svg><span>Fechar</span></button><span class="pv-toolbar-divider"></span><button class="pv-icon-button" id="pv-more-trigger" data-command="more" aria-haspopup="menu" aria-controls="pv-floating-menu" aria-expanded="false" aria-label="Mais ações da conversa" title="Mais ações da conversa"><svg class="pv-icon" aria-hidden="true"><use href="#pv-more"/></svg></button><button class="pv-icon-button pv-details-toggle" id="pv-details-toggle" data-command="toggle-details" aria-label="Informações do contato" aria-controls="pv-contact-panel" title="Informações do contato"><svg class="pv-icon" aria-hidden="true"><use href="#pv-panel"/></svg></button></div>
        </header>
        <div class="pv-message-search-bar" id="pv-message-search-bar" hidden><svg class="pv-icon" aria-hidden="true"><use href="#pv-search"/></svg><input type="search" id="pv-message-search" placeholder="Buscar nas mensagens desta conversa" aria-label="Buscar nas mensagens desta conversa"><span id="pv-message-search-count"></span><button class="pv-icon-button" data-command="close-message-search" aria-label="Fechar busca de mensagens"><svg class="pv-icon" aria-hidden="true"><use href="#pv-close"/></svg></button></div>
        <div class="pv-reminder-banner" id="pv-reminder-banner" hidden></div>
        <div class="pv-thread" id="pv-thread" tabindex="0" aria-label="Mensagens da conversa"><div class="pv-thread-content" id="pv-thread-content"></div></div>
        <form class="pv-composer" id="pv-composer">
          <div class="pv-composer-heading"><div class="pv-compose-modes" role="tablist" aria-label="Tipo de mensagem"><button type="button" role="tab" aria-selected="true" data-mode="reply">Responder</button><button type="button" role="tab" aria-selected="false" data-mode="note"><svg class="pv-icon" aria-hidden="true"><use href="#pv-note"/></svg>Nota interna</button></div><span class="pv-compose-hint">Enter envia<span> · </span>Shift + Enter quebra a linha</span></div>
          <div class="pv-reply-preview" id="pv-reply-preview" hidden></div>
          <div class="pv-attachment-preview" id="pv-attachment-preview" hidden></div>
          <div class="pv-input-box"><div class="pv-input-tools"><button type="button" class="pv-icon-button" id="pv-attach-trigger" data-command="attachments" aria-haspopup="menu" aria-expanded="false" aria-label="Anexar" title="Anexar"><svg class="pv-icon" aria-hidden="true"><use href="#pv-plus"/></svg></button><button type="button" class="pv-icon-button" id="pv-emoji-trigger" data-command="emoji" aria-haspopup="dialog" aria-expanded="false" aria-controls="pv-emoji-popover" aria-label="Inserir emoji" title="Inserir emoji"><svg class="pv-icon" aria-hidden="true"><use href="#pv-smile"/></svg></button><button type="button" class="pv-icon-button pv-ai-trigger" id="pv-ai-trigger" data-command="ai" aria-haspopup="menu" aria-expanded="false" aria-label="Assistente de escrita" title="Assistente de escrita"><svg class="pv-icon" aria-hidden="true"><use href="#pv-sparkles"/></svg></button></div><textarea id="pv-message-input" rows="1" aria-label="Escreva uma mensagem" placeholder="Escreva uma mensagem..."></textarea><button type="button" class="pv-icon-button pv-audio-button" id="pv-audio" data-command="audio" aria-label="Gravar áudio de exemplo" title="Gravar áudio"><svg class="pv-icon" aria-hidden="true"><use href="#pv-mic"/></svg></button><button type="submit" class="pv-send-button" id="pv-send-message" aria-label="Enviar mensagem" title="Enviar mensagem" hidden><svg class="pv-icon" aria-hidden="true"><use href="#pv-send"/></svg></button></div>
          <div class="pv-note-hint" id="pv-note-hint" hidden>Somente sua equipe verá esta nota.</div>
        </form>
      </section>
      <aside class="pv-contact-panel" id="pv-contact-panel" aria-label="Informações do contato">
        <div class="pv-details-resizer" id="pv-details-resizer" role="separator" aria-orientation="vertical" aria-label="Redimensionar informações do contato" aria-controls="pv-contact-panel" aria-valuemin="260" aria-valuemax="560" aria-valuenow="320" tabindex="0" title="Arraste para ajustar a ficha. Use ← → ou dê dois cliques para restaurar."><span></span></div>
        <div class="pv-details-drawer-header"><div><strong>Informações do contato</strong></div><button class="pv-icon-button" data-command="hide-details" aria-label="Fechar informações do contato"><svg class="pv-icon" aria-hidden="true"><use href="#pv-close"/></svg></button></div>
        <div id="original-contact-panel" class="pv-original-panel"></div>
      </aside>
    </main>
  </div>
    </div>
  </div>
  <div id="pv-drawer-backdrop" class="pv-drawer-backdrop" hidden></div>
  <div class="pv-filter-popover" id="pv-filter-popover" role="dialog" aria-label="Filtrar conversas" hidden>
    <div class="pv-popover-heading"><strong>Filtrar conversas</strong><button class="pv-text-button" data-command="clear-filters">Limpar</button></div>
    <div class="pv-filter-options"><label><input type="checkbox" name="mine"><span><svg class="pv-icon" aria-hidden="true"><use href="#pv-person"/></svg>Minhas</span></label><label><input type="checkbox" name="unread"><span><svg class="pv-icon" aria-hidden="true"><use href="#pv-unread"/></svg>Não lidos</span></label><label><input type="checkbox" name="groups"><span><svg class="pv-icon" aria-hidden="true"><use href="#pv-users"/></svg>Grupos</span></label></div>
    <div class="pv-filter-field"><label for="pv-number-filter">Número do WhatsApp</label><select id="pv-number-filter"><option value="all">Todos os números</option><option value="commercial">Comercial · (77) 99999-0100</option><option value="support">Suporte · (77) 99999-0200</option></select></div>
    <fieldset class="pv-tag-filters"><legend>Tags do contato</legend><label><input type="checkbox" name="tag" value="cliente">Cliente</label><label><input type="checkbox" name="tag" value="interesse em iphone">Interesse em iPhone</label><label><input type="checkbox" name="tag" value="retorno">Retorno</label></fieldset>
    <div class="pv-filter-field"><label for="pv-tag-mode">Combinar tags</label><select id="pv-tag-mode"><option value="and">Todas as selecionadas (E)</option><option value="or">Qualquer selecionada (OU)</option></select></div>
    <button class="pv-button pv-primary pv-apply-filters" id="pv-apply-filters" data-command="apply-filters">Aplicar filtros</button>
  </div>
  <div class="pv-floating-menu" id="pv-floating-menu" role="menu" aria-label="Ações" hidden></div>
  <div class="pv-emoji-popover" id="pv-emoji-popover" role="dialog" aria-label="Inserir emoji" hidden></div>
  <input type="file" id="pv-media-file" accept="image/*,video/*" hidden><input type="file" id="pv-document-file" hidden>
  <div class="pv-toast" id="pv-toast" role="status" hidden></div>
  <dialog class="pv-modal" id="pv-modal" aria-labelledby="pv-modal-title"><form id="pv-modal-form"><div class="pv-modal-heading"><h2 id="pv-modal-title"></h2><button type="button" class="pv-icon-button" data-command="cancel-modal" aria-label="Fechar janela"><svg class="pv-icon" aria-hidden="true"><use href="#pv-close"/></svg></button></div><div id="pv-modal-content"></div><div class="pv-modal-footer"><button type="button" class="pv-button pv-secondary" data-command="cancel-modal">Cancelar</button><button type="submit" class="pv-button pv-primary" id="pv-modal-confirm">Confirmar</button></div></form></dialog>
</body>
</html>
